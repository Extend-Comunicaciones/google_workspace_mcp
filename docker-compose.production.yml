# =============================================================
# google_workspace_mcp — PRODUCCIÓN
# Diferencias respecto a docker-compose.yml (upstream):
#   1. El puerto 8000 NO se expone al host (solo red interna)
#   2. Red compartida "extend-network" (nginx-proxy + LibreChat)
#   3. Solo Docs / Sheets / Slides, tier "core" (~8 tools en vez de ~111)
#   4. OAuth 2.1: la identidad sale del token, no del parámetro user_google_email
#   5. Sin lectura de archivos locales del contenedor
# Usar con: docker compose -f docker-compose.production.yml up -d --build
# Secretos (GOOGLE_OAUTH_CLIENT_ID/SECRET) van en .env.production, NUNCA en git.
# =============================================================

services:
  gws_mcp:
    build: .
    container_name: gws_mcp
    expose:
      - "8000"
    environment:
      - GOOGLE_MCP_CREDENTIALS_DIR=/app/store_creds
      # Servicios y cantidad de tools (el Dockerfile los traduce a --tools / --tool-tier)
      - TOOLS=docs sheets slides
      - TOOL_TIER=core
      # OAuth 2.1 (identidad por usuario a partir del bearer token)
      - MCP_ENABLE_OAUTH21=true
      - WORKSPACE_MCP_OAUTH_PROXY_STORAGE_BACKEND=disk
      - WORKSPACE_MCP_OAUTH_PROXY_DISK_DIRECTORY=/app/store_creds
      # Endurecimiento
      - WORKSPACE_MCP_DISABLE_LOCAL_FILES=true
      # Hosts válidos (sin puerto): nombre del contenedor + dominio público
      - WORKSPACE_MCP_ALLOWED_HOSTS=gws_mcp,mcp.preludio.extend.cl
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
      - store_creds:/app/store_creds:rw
    env_file:
      - .env.production
    networks:
      - extend-network
    restart: unless-stopped

volumes:
  store_creds:

networks:
  extend-network:
    external: true
